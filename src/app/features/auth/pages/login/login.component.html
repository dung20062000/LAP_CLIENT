<div class="login-page-wrapper">
  <!-- Header -->
  <app-header />

  <!-- Main Content: Slide Banner + Login Form -->
  <main class="login-layout">
  <!-- Slide Banner as Background -->
  <div class="banner-background">
    <app-slide-banner [slides]="banners" />
  </div>

  <div class="container-fluid h-100 p-0 form-overlay">
    <div class="row h-100 no-gutters justify-content-end align-items-center pr-lg-5">

      <!-- Login Form Section -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-4 form-section">
        <div class="login-card-wrapper mx-auto">

          <!-- Login Card -->
          <div class="login-card">

            <!-- Logo BA GPS -->
            <div class="login-logo text-center">
              <img src="/images/logos/logo.svg" alt="BA GPS" class="img-fluid logo-img">
            </div>

            <!-- Error Alert -->
            @if (errorMessage()) {
            <div class="alert alert-danger" role="alert">
              <i class="fas fa-exclamation-circle mr-2"></i>
              {{ errorMessage() }}
              <button type="button" class="close-btn" (click)="errorMessage.set('')" aria-label="Đóng">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            }

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

              <!-- Username -->
              <div class="form-group">
                <div class="input-icon-wrapper" [class.input-error]="isFieldInvalid('username')"
                  [class.input-success]="loginForm.get('username')?.valid && loginForm.get('username')?.value">
                  <span class="input-icon-left">
                    <i class="fas fa-user text-muted"></i>
                  </span>
                  <input type="text" id="username" maxlength="50" class="form-input-pill" formControlName="username"
                    placeholder="{{ 'login.username_placeholder' | translate }}" autocomplete="username">
                </div>
                @if (isFieldInvalid('username')) {
                <div class="error-text">
                  {{ getFieldError('username') }}
                </div>
                }
              </div>

              <!-- Password -->
              <div class="form-group">
                <div class="input-icon-wrapper" [class.input-error]="isFieldInvalid('password')"
                  [class.input-success]="loginForm.get('password')?.valid && loginForm.get('password')?.value">
                  <span class="input-icon-left">
                    <i class="fas fa-lock text-muted"></i>
                  </span>
                  <input [type]="showPassword() ? 'text' : 'password'" id="password" maxlength="200"
                    class="form-input-pill" formControlName="password"
                    placeholder="{{ 'login.password_placeholder' | translate }}" autocomplete="current-password">
                  <button type="button" class="input-icon-right-btn" (click)="showPassword.set(!showPassword())"
                    [attr.aria-label]="(showPassword() ? 'login.password_hide' : 'login.password_show') | translate">
                    <i class="fas" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
                  </button>
                </div>
                @if (isFieldInvalid('password')) {
                <div class="error-text">
                  {{ getFieldError('password') }}
                </div>
                }
              </div>

              <!-- Remember Me & Forgot Password -->
              <div class="form-options d-flex justify-content-between align-items-center">
                <div class="custom-control custom-checkbox">
                  <input type="checkbox" class="custom-control-input" id="rememberMe" formControlName="rememberMe">
                  <label class="custom-control-label" for="rememberMe">{{ 'login.remember_me' | translate }}</label>
                </div>
                <a href="#" class="forgot-password-link">{{ 'login.forgot_password' | translate }}</a>
              </div>

              <!-- Submit Button -->
              <div class="submit-section">
                <button type="submit" class="btn btn-login-pill btn-block" [disabled]="isLoading()">
                  @if (isLoading()) {
                  <span class="spinner-border spinner-border-sm mr-2"></span>
                  {{ 'login.btn_loading' | translate }}
                  } @else {
                  {{ 'login.btn_login' | translate }}
                  }
                </button>
              </div>

            </form>

            <!-- QR Code Section -->
            <div class="qr-code-section text-center">
              <div class="qr-container">
                <img src="/images/qr/qr-code.svg" alt="Mã QR" class="qr-image">
              </div>
              <p class="qr-text">{{ 'login.qr_text' | translate }}</p>
            </div>

          </div>

        </div>
      </div>

    </div>
  </div>
</main>

  <!-- Footer -->
  <app-footer />
</div>
