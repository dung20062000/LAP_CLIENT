<!-- Widget Container – bao ngoài mỗi widget Dashboard -->
<div class="widget-wrapper mb-3" [ngClass]="layoutClass" [class.options-open]="showOptions">
  <div class="widget-card" [class.widget-collapsed]="collapsed">
    <!-- Widget Header -->
    <div class="widget-header">
      <div class="widget-title">
        <span class="widget-title-icon">
          <ng-content select="[widgetIcon]" />
        </span>
        <span class="widget-title-text">{{ title }}</span>
      </div>

      <div class="widget-actions">
        <!-- Nút Thu gọn / Mở rộng -->
        <button
          class="widget-btn widget-btn--collapse"
          [title]="collapsed ? 'Mở rộng' : 'Thu gọn'"
          (click)="toggleCollapse()"
        >
          <i class="fas" [ngClass]="collapsed ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
        </button>

        <!-- Nút Tải lại -->
        <button
          class="widget-btn widget-btn--reload"
          title="Tải lại"
          [class.spinning]="isReloading"
          (click)="onReload()"
        >
          <i class="fas fa-arrow-rotate-right"></i>
        </button>

        <!-- Nút Options-->
        <div class="widget-options-wrap" [class.hide-on-mobile]="true">
          <button
            class="widget-btn widget-btn--options"
            title="Tùy chọn kích thước"
            (click)="toggleOptions($event)"
          >
            <i class="fas fa-ellipsis-v"></i>
          </button>

          <!-- Dropdown chọn kích thước (2 cấp) -->
          @if (showOptions) {
            <div class="widget-options-menu">
              <ul class="options-list">
                <li class="has-submenu">
                  <span>Độ rộng</span>
                  <i class="fas fa-chevron-right submenu-indicator"></i>

                  <!-- Submenu (Level 2) nằm bên phải hoặc trái -->
                  <div class="widget-submenu" [class.open-left]="openLeft">
                    <ul class="options-list">
                      @for (opt of sizeOptions; track opt) {
                        <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus, @angular-eslint/template/click-events-have-key-events -->
                        <li [class.active]="size === opt.value" (click)="onSelectSize(opt.value); $event.stopPropagation()">
                          @if (size === opt.value) {
                            <i class="fas fa-check"></i>
                          } @else {
                            <i class="fas fa-check" style="visibility: hidden;"></i>
                          }
                          <span>{{ opt.label }}</span>
                        </li>
                      }
                    </ul>
                  </div>
                </li>
              </ul>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Widget Body (ẩn khi collapsed) -->
    @if (!collapsed) {
      <div class="widget-body">
        <ng-content />
      </div>
    }
  </div>
</div>
