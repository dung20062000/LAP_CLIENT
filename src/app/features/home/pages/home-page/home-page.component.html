<!-- Banner Section -->
<app-slide-banner [slides]="welcomeBanners" />

<!-- Welcome Section -->
<div class="container text-center my-5">
  <h3 class="section-title">
    <i class="fas fa-satellite-dish text-primary mr-2"></i>
    Hệ thống Quản lý Đăng nhập BA GPS
  </h3>
  <p class="text-muted mt-2">
    Chào mừng <strong>{{ getCurrentUserName() }}</strong> đã đăng nhập thành công!
  </p>
</div>

<!-- Features Section -->
<section class="features-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h4 class="section-heading">
        <i class="fas fa-cogs text-primary mr-2"></i>Tính năng nổi bật
      </h4>
      <p class="text-muted">Khám phá các tính năng mạnh mẽ của hệ thống BA GPS</p>
    </div>
    <div class="row">
      @for (feature of featureCards; track feature.title) {
        <div class="col-lg-4 col-md-6 mb-4">
          <div class="feature-card card h-100 shadow-sm border-0">
            <div class="card-body text-center p-4">
              <div class="feature-icon mb-3 mx-auto d-flex align-items-center justify-content-center"
                   [style.backgroundColor]="feature.color + '15'"
                   [style.color]="feature.color">
                <i [class]="feature.icon"></i>
              </div>
              <h5 class="feature-title mb-2">{{ feature.title }}</h5>
              <p class="feature-desc text-muted small mb-0">{{ feature.description }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
