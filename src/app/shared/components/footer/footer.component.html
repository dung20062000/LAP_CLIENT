<footer class="site-footer">
  <div class="container-fluid px-70">

    <!-- Hàng chính: Chi nhánh + App/Social links -->
    <div class="row no-gutters footer-main">

      <!-- Khu vực chi nhánh: chiếm 11/12 width trên desktop, full width trên mobile -->
      <div class="col-12 col-xl-11">
        <div class="row no-gutters footer-grid">
          <!-- Lặp qua danh sách chi nhánh -->
          @for (branch of branches; track branch.id) {
          <div class="col-sm-2 footer-col">
            <!-- Tên thành phố — dùng translate pipe để hiển thị theo ngôn ngữ -->
            <h4 class="footer-city">{{ branch.city | translate }}</h4>
            <!-- Địa chỉ chi tiết -->
            <p class="footer-desc">{{ branch.address }}</p>
          </div>
          }
        </div>
      </div>

      <!-- Khu vực app links + social: 1/12 width trên desktop, full width bên dưới branches trên mobile -->
      <div class="col-12 col-xl-1 footer-app-col">
        <div class="footer-app-links-container">
          <!-- Nút tải app trên Google Play và App Store -->
          <div class="footer-app-stores">
            <a class="footer-app-link" href="https://play.google.com/store/apps/details?id=vn.bagps.gpsmobile" target="_blank" rel="noopener noreferrer" title="Google Play">
              <img src="/images/logos-social/chplay.png" alt="Google Play" width="120" height="40">
            </a>
            <a class="footer-app-link" href="https://itunes.apple.com/us/app/ba-gps/id1466206178?ls=1&mt=8" target="_blank" rel="noopener noreferrer" title="App Store">
              <img src="/images/logos-social/app-store.png" alt="App Store" width="120" height="40">
            </a>
          </div>
          <!-- Icon mạng xã hội: Facebook, Zalo, YouTube -->
          <div class="footer-app-links-social">
            <a href="https://www.facebook.com/giamsathanhtrinhbinhanh/" target="_blank" rel="noopener noreferrer" title="Facebook">
              <img src="https://img.icons8.com/fluency/48/facebook-new.png" alt="Facebook" width="28" height="28">
            </a>
            <a href="https://zalo.me/1958838581480438876" target="_blank" rel="noopener noreferrer" title="Zalo">
              <img src="https://img.icons8.com/color/48/zalo.png" alt="Zalo" width="28" height="28">
            </a>
            <a href="https://www.youtube.com/@BAGPS" target="_blank" rel="noopener noreferrer" title="YouTube">
              <img src="https://img.icons8.com/color/48/youtube-play.png" alt="YouTube" width="28" height="28">
            </a>
          </div>
        </div>
      </div>

    </div>

  </div>
</footer>
