<header class="site-header">
  <div class="header-container">

    <!-- Logo -->
    <div class="header-logo">
      <img src="/images/logos/logo.svg" alt="BA GPS" />
    </div>

    <!-- Navigation Menu -->
    <nav class="header-nav">
      <ul class="nav-list">
        @for (item of menuItems(); track item.label) {
          <li class="nav-item">
            <a
              class="nav-link"
              [href]="item.href"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- Right Actions -->
    <div class="header-right">

      <!-- Zalo -->
      <a
        class="zalo-btn"
        [href]="zaloUrl"
        target="_blank"
        rel="noopener noreferrer"
        title="Zalo"
      >
        <img
          src="https://img.icons8.com/color/48/zalo.png"
          alt="Zalo"
          width="22"
          height="22"
        />
        <span class="btn-text">{{ 'common.zalo' | translate }}</span>
      </a>

      <!-- Hotline -->
      <a class="hotline-btn" [href]="'tel:' + hotline" title="Hotline">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
        <span>{{ hotline }}</span>
      </a>

      <!-- Language Selector -->
      <div class="lang-selector" [title]="'header.select_language' | translate" (clickOutside)="langOpen = false">
        <div class="lang-current" (click)="langOpen = !langOpen">
          <span class="lang-flag-wrapper">
            <img
              [src]="currentLang === 'vi'
                ? 'https://img.icons8.com/color/48/vietnam-circular.png'
                : 'https://img.icons8.com/color/48/usa-circular.png'"
              [alt]="currentLang === 'vi' ? 'Việt Nam' : 'English'"
              width="20"
              height="20"
            />
          </span>
          <span class="lang-label">{{ currentLang === 'vi' ? 'Tiếng Việt' : 'English' }}</span>
          <span class="lang-arrow">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
              <path d="M7 10l5 5 5-5z"/>
            </svg>
          </span>
        </div>
        @if (langOpen) {
          <ul class="lang-dropdown">
            @for (lang of languages; track lang.code) {
              <li
                [class.active]="currentLang === lang.code"
                (click)="selectLang(lang.code)"
              >
                <span class="lang-flag-wrapper round">
                  <img [src]="lang.flag" [alt]="lang.label" width="20" height="20" />
                </span>
                <span>{{ lang.label }}</span>
              </li>
            }
          </ul>
        }
      </div>

    </div>

  </div>
</header>
