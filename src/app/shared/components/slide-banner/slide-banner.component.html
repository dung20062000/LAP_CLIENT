<section class="banner-section">
  <!-- Kiểm tra có slides không — currentSlide guard cho template -->
  @if (hasSlides() && currentSlide(); as slide) {
  <!-- Wrapper chinh — hover de hien arrows va tam dung auto-play -->
  <div
    class="banner-wrapper"
    (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()"
  >

    <!-- Container chứa tất cả slides -->
    <div class="banner-slides-container">
      <!-- Lặp qua resolvedSlides — chỉ slide nào có index = currentIndex mới active -->
      @for (item of resolvedSlides(); track item.id; let i = $index) {
      <div class="banner-slide" [class.active]="i === currentIndex()">
        <!-- Ảnh banner làm background — clickable khi có link -->
        @if (item.link) {
          <a
            target="_blank"
            rel="noopener noreferrer"
            class="banner-link-wrapper"
            [attr.aria-label]="item.title"
            [href]="item.link"
          >
            <div class="banner-bg" [style.backgroundImage]="'url(' + item.imageUrl + ')'"></div>
          </a>
        } @else {
          <div class="banner-bg" [style.backgroundImage]="'url(' + item.imageUrl + ')'"></div>
        }
        <!-- Overlay làm mờ ảnh để text dễ đọc -->
        <div class="banner-overlay"></div>
        <!-- Nội dung text: tiêu đề + mô tả + nút chi tiết -->
        <div class="banner-content">
          <div class="banner-text">
            <h2 class="banner-title">{{ item.title }}</h2>
            <p class="banner-summary">{{ item.shortContents }}</p>
            <!-- Nút chi tiết — chỉ hiện nếu có link, ẩn trên tablet/mobile -->
            @if (item.link) {
              <a
                target="_blank"
                rel="noopener noreferrer"
                class="btn btn-light banner-btn mt-1"
                [href]="item.link"
              >
                {{ t('banner.btn_detail') }} <i class="fas fa-arrow-right ml-2"></i>
              </a>
            }
          </div>
        </div>
      </div>
      }
    </div>

    <!-- Nút mũi tên chuyển slide trước/sau — hiện khi hover -->
    <button
      class="banner-arrow arrow-prev"
      [class.visible]="isHovered()"
      [attr.aria-label]="t('banner.aria_prev')"
      (click)="prevSlide()"
    >
      <i class="fas fa-chevron-left"></i>
    </button>
    <button
      class="banner-arrow arrow-next"
      [class.visible]="isHovered()"
      [attr.aria-label]="t('banner.aria_next')"
      (click)="nextSlide()"
    >
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Các chấm tròn chỉ số slide — click để nhảy đến slide tương ứng -->
    <div class="banner-dots">
      @for (idx of dotIndices(); track idx) {
        <button
          class="dot"
          [class.active]="idx === currentIndex()"
          [attr.aria-label]="t('banner.aria_slide') + ' ' + (idx + 1)"
          (click)="goToSlideByIndex(idx)"
        ></button>
      }
    </div>
  </div>
  } @else {
  <!-- Fallback khi không có slides — hiện banner mặc định -->
  <div class="banner-default">
    <div class="banner-bg" style="background-image: url('/images/banners/BANNER_1.jpg')"></div>
  </div>
  }
</section>
